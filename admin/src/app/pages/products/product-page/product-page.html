<div class="product-page-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Products Management</h1>
      <p class="page-subtitle">View, create, edit catalog items, and maintain inventory levels.</p>
    </div>

    <div class="header-actions">
      <button (click)="openCreateModal()" class="btn btn-primary create-product-btn">
        + Add New Product
      </button>
    </div>
  </div>

  <!-- Feedback Banner -->
  @if (feedback(); as fb) {
    <div class="feedback-banner" [class.feedback-success]="fb.type === 'success'" [class.feedback-error]="fb.type === 'error'">
      <span class="feedback-text">{{ fb.text }}</span>
    </div>
  }

  <!-- Filters & Search Toolbar -->
  <div class="toolbar-card admin-card">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        (keyup.enter)="onSearch()"
        placeholder="Search products..." 
        class="search-input" />
      @if (searchQuery()) {
        <button (click)="searchQuery.set(''); onSearch()" class="clear-search-btn" title="Clear">
          &times;
        </button>
      }
    </div>

    <div class="filter-controls">
      <!-- Category Filter -->
      <select 
        [(ngModel)]="selectedCategory" 
        (change)="onFilterChange()" 
        class="form-select filter-select">
        <option value="">All Categories</option>
        @for (cat of categories(); track cat._id) {
          <option [value]="cat._id">{{ cat.name }}</option>
        }
      </select>

      <button (click)="onSearch()" class="btn btn-secondary btn-sm">
        Search
      </button>

      @if (selectedCategory() || searchQuery()) {
        <button (click)="onClearFilters()" class="btn btn-danger btn-sm">
          Reset Filters
        </button>
      }
    </div>
  </div>

  <!-- Reusable Modular Product List Component -->
  <app-product-list
    [products]="products()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    [totalPages]="totalPages()"
    [isLoading]="isLoading()"
    (editProduct)="openEditModal($event)"
    (deleteProduct)="handleDelete($event)"
    (pageChange)="onPageChange($event)">
  </app-product-list>

  <!-- Reusable Modular Product Form Modal / Overlay -->
  @if (showFormModal()) {
    <div class="modal-backdrop" (click)="closeModal()">
      <div class="modal-dialog" (click)="$event.stopPropagation()">
        <app-product-form
          [productToEdit]="selectedProductForEdit()"
          [categories]="categories()"
          [subCategories]="subCategories()"
          [isSubmitting]="isSubmitting()"
          (save)="handleFormSave($event)"
          (cancel)="closeModal()">
        </app-product-form>
      </div>
    </div>
  }
</div>
