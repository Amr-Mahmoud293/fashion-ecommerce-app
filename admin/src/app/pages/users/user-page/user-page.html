<div class="user-page-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Users & Customers Management</h1>
      <p class="page-subtitle">Oversee registered customer accounts, manage active privileges, and assign admin roles.
      </p>
    </div>

    <div class="header-actions">
      <button (click)="loadUsers()" class="btn btn-secondary refresh-btn" [disabled]="isLoading()" title="Reload Users">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          [class.spin]="isLoading()">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 21h5v-5" />
        </svg>
        <span>Refresh</span>
      </button>
    </div>
  </div>

  <!-- Feedback Banner -->
  @if (feedback(); as fb) {
  <div class="feedback-banner" [class.feedback-success]="fb.type === 'success'"
    [class.feedback-error]="fb.type === 'error'">
    <span class="feedback-text">{{ fb.text }}</span>
  </div>
  }

  <!-- Filters & Search Toolbar -->
  <div class="toolbar-card admin-card">
    <div class="search-box">
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search by name, email, or phone..."
        class="search-input" />
      @if (searchQuery()) {
      <button (click)="searchQuery.set('')" class="clear-search-btn" title="Clear">
        &times;
      </button>
      }
    </div>

    <div class="filter-controls">
      <!-- Role Filter -->
      <select [(ngModel)]="roleFilter" class="form-select filter-select">
        <option value="">All Roles</option>
        <option value="user">Users</option>
        <option value="admin">Admins</option>
      </select>

      <!-- Status Filter -->
      <select [(ngModel)]="statusFilter" class="form-select filter-select">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="blocked">Blocked</option>
      </select>

      @if (roleFilter() || statusFilter() || searchQuery()) {
      <button (click)="onResetFilters()" class="btn btn-secondary btn-sm">
        Reset Filters
      </button>
      }
    </div>
  </div>

  <!-- User List Table -->
  <app-user-list [users]="filteredUsers()" [total]="total()" [page]="page()" [limit]="limit()"
    [totalPages]="totalPages()" [isLoading]="isLoading()" (toggleStatus)="onStatusToggle($event)"
    (toggleRole)="onRoleToggle($event)" (deleteUser)="onDelete($event)" (pageChange)="onPageChange($event)">
  </app-user-list>
</div>
