<div class="faq-page-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Frequently Asked Questions</h1>
      <p class="page-subtitle">
        Manage customer support FAQs, help articles, and policy answers.
      </p>
    </div>

    <!-- Action Button -->
    <button type="button" (click)="openCreateModal()" class="btn btn-primary" title="Add new FAQ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>Add FAQ</span>
    </button>
  </div>

  <!-- Feedback Banner -->
  @if (feedback(); as fb) {
  <div class="feedback-banner" [class.feedback-success]="fb.type === 'success'" [class.feedback-error]="fb.type === 'error'">
    <span class="feedback-text">{{ fb.text }}</span>
  </div>
  }

  <!-- Search Filter Toolbar -->
  <div class="toolbar-card admin-card">
    <div class="search-input-group">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Search questions or answers..."
        class="search-input"
      />
      @if (searchQuery()) {
      <button type="button" (click)="searchQuery.set('')" class="clear-search-btn" title="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      }
    </div>

    <div class="faq-counter">
      <span>Total: <strong>{{ filteredFaqs().length }}</strong> items</span>
    </div>
  </div>

  <!-- FAQs List Component -->
  <app-faq-list
    [faqs]="filteredFaqs()"
    [isLoading]="isLoading()"
    (edit)="openEditModal($event)"
    (delete)="handleDelete($event)"
  ></app-faq-list>

  <!-- Add / Edit FAQ Modal Form -->
  @if (showFormModal()) {
  <app-faq-form
    [faq]="selectedFaqForEdit()"
    [isSubmitting]="isSubmitting()"
    (save)="handleSave($event)"
    (cancel)="closeModal()"
  ></app-faq-form>
  }
</div>
