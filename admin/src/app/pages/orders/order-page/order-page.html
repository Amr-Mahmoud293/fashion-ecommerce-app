<div class="order-page-wrapper">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Orders Management</h1>
      <p class="page-subtitle">Monitor customer purchases, review delivery addresses, and manage order statuses.</p>
    </div>

    <div class="header-actions">
      <button (click)="loadOrders()" class="btn btn-secondary refresh-btn" [disabled]="isLoading()" title="Reload Orders">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.spin]="isLoading()">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 21h5v-5" />
        </svg>
        <span>Refresh</span>
      </button>
    </div>
  </div>

  <!-- Feedback Banner -->
  @if (feedback(); as fb) {
  <div class="feedback-banner" [class.feedback-success]="fb.type === 'success'" [class.feedback-error]="fb.type === 'error'">
    <span class="feedback-text">{{ fb.text }}</span>
  </div>
  }

  <!-- Filters & Search Toolbar -->
  <div class="toolbar-card admin-card">
    <div class="search-box">
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        placeholder="Search by order #, customer, or email..." 
        class="search-input" />
      @if (searchQuery()) {
      <button (click)="searchQuery.set('')" class="clear-search-btn" title="Clear">
        &times;
      </button>
      }
    </div>

    <div class="filter-controls">
      <!-- Status Filter -->
      <select [(ngModel)]="selectedStatusFilter" class="form-select filter-select">
        <option value="">All Statuses</option>
        @for (st of statusOptions; track st) {
        <option [value]="st">{{ st | titlecase }}</option>
        }
      </select>

      @if (selectedStatusFilter() || searchQuery()) {
      <button (click)="onResetFilters()" class="btn btn-secondary btn-sm">
        Reset Filters
      </button>
      }
    </div>
  </div>

  <!-- Orders List Component -->
  <app-order-list
    [orders]="filteredOrders()"
    [total]="total()"
    [page]="page()"
    [limit]="limit()"
    [totalPages]="totalPages()"
    [isLoading]="isLoading()"
    (viewOrder)="openDetailModal($event)"
    (pageChange)="onPageChange($event)">
  </app-order-list>

  <!-- Order Detail Modal -->
  @if (showDetailModal()) {
  <div class="modal-backdrop" (click)="closeDetailModal()">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <app-order-detail
        [order]="selectedOrderForDetail()"
        [isUpdating]="isUpdatingStatus()"
        (statusChange)="handleStatusUpdate($event)"
        (close)="closeDetailModal()">
      </app-order-detail>
    </div>
  </div>
  }
</div>
