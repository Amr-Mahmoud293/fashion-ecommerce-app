@if (reviews.length > 0) {
<section class="reviews-section">
  <div class="section-container">
    @if (showHeader) {
    <div class="section-header">
      <div>
        <span class="section-tag">{{ tag }}</span>
        <h2 class="section-title">{{ title }}</h2>
      </div>
      <div class="reviews-overall-rating">
        <div class="overall-stars">
          @for (star of [1, 2, 3, 4, 5]; track star) {
          <svg class="star-icon filled" viewBox="0 0 24 24" fill="currentColor">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
          }
        </div>
        <span class="overall-text">
          <strong>{{ getAverageRating() }} / 5</strong> rating from verified customers
        </span>
      </div>
    </div>
    }

    <div class="reviews-grid">
      @for (rev of reviews; track rev._id) {
      <app-review-card [review]="rev"></app-review-card>
      }
    </div>
  </div>
</section>
}
